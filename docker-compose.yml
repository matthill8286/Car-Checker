# Car check stack: two containers. Postgres and the reverse proxy already run on the server and
# are not part of this file (see README "Deploying").
name: carcheck

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4000
    expose:
      - '4000'
    networks: [default, proxy]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'
    networks: [default, proxy]

networks:
  # The existing reverse proxy's network, so it can reach api:4000 and web:3000 by name.
  # Set PROXY_NETWORK in .env once `docker network ls` on the server shows its name.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
