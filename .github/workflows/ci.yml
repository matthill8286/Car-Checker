name: CI

# CI runs on pull requests and by hand only. Merging into main deploys (see deploy.yml),
# because the pull request has already been checked.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated API client is up to date
        run: pnpm gen:client && git diff --exit-code apps/api/openapi.json apps/web/src/api/schema.d.ts
