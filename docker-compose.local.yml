# Local run without the server's proxy: `docker compose -f docker-compose.yml -f docker-compose.local.yml up`
services:
  api:
    env_file: !reset []
    environment:
      CARCHECK_MODE: mock
      MOCK_LATENCY_MS: 400
    ports: ['4000:4000']
    networks: !override [default]
  web:
    ports: ['3000:3000']
    networks: !override [default]

networks:
  proxy: !reset {}
